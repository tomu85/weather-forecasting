<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1050px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* Updated Responsive Search Box */
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            align-items: center;
        }

        input {
            flex: 1;
            min-width: 0;
            /* Prevents input overflow on small screens */
            font-size: 1rem;
            padding: 14px 20px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        .btn {
            padding: 14px 24px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            /* Button text overflow float fixes */
            flex-shrink: 0;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        /* Perfectly Rounded Location Icon Button */
        .icon-btn {
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 50%;
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .current-weather {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 20px 10px;
        }

        .weather-info span {
            font-size: 1.25rem;
            color: #94a3b8;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .weather-info h2 {
            font-size: 5rem;
            font-weight: 800;
            margin: 10px 0;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .weather-info p {
            font-size: 1.5rem;
            text-transform: capitalize;
            color: #38bdf8;
            font-weight: 500;
        }

        .weather-icon img {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.4));
        }

        .weather-detail {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 22px 18px;
            text-align: center;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .detail-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .detail-card p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .detail-card h3 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .forecast-title {
            margin: 45px 0 24px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .forecast-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(129, 140, 248, 0.3);
        }

        .forecast-card h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .forecast-card img {
            width: 70px;
            height: 70px;
            margin: 10px 0;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .forecast-card .temp {
            font-weight: 700;
            font-size: 1.3rem;
            color: #ffffff;
        }

        .forecast-card .range {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Enhanced Media Queries for Mobile and Small Screen Devices */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .weather-card {
                padding: 24px 18px;
                border-radius: 24px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header h1 {
                font-size: 1.6rem;
                text-align: center;
            }

            .search-box {
                max-width: 100%;
                gap: 8px;
            }

            input {
                padding: 12px 16px;
                font-size: 0.95rem;
            }

            .btn {
                padding: 12px 18px;
                font-size: 0.9rem;
            }

            .icon-btn {
                width: 42px;
                height: 42px;
            }

            .weather-info h2 {
                font-size: 3.5rem;
            }

            .weather-icon img {
                width: 100px;
                height: 100px;
            }

            .weather-detail {
                grid-template-columns: repeat(2, 1fr);
            }

            .forecast-container {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .search-box {
                flex-wrap: nowrap;
            }

            .btn {
                padding: 12px 14px;
            }

            .weather-detail {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .forecast-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="weather-card">
            <div class="header">
                <h1> Weather-forecasting</h1>
                <div class="search-box">
                    <input type="text" id="cityInput" placeholder="Enter city name..." value="Raipur">
                    <button class="btn" id="searchBtn">Search</button>
                    <button class="btn icon-btn" id="geoBtn" title="Current Location">📍</button>
                </div>
            </div>

            <div class="current-weather">
                <div class="weather-info">
                    <span id="location">Raipur, IN</span>
                    <h2 id="temperature">--°C</h2>
                    <p id="description">Fetching weather...</p>
                </div>
                <div class="weather-icon">
                    <img id="currentIcon" src="https://openweathermap.org/img/wn/02d@4x.png" alt="weather condition">
                </div>
            </div>

            <div class="weather-detail">
                <div class="detail-card">
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>
                <div class="detail-card">
                    <p>Wind Speed</p>
                    <h3 id="wind">-- km/h</h3>
                </div>
                <div class="detail-card">
                    <p>Pressure</p>
                    <h3 id="pressure">-- hPa</h3>
                </div>
                <div class="detail-card">
                    <p>Visibility</p>
                    <h3 id="visibility">-- km</h3>
                </div>
            </div>

            <h2 class="forecast-title">5-Day Live Forecast</h2>
            <div class="forecast-container" id="forecastContainer">
                <!-- Live Forecast Cards Rendered via JavaScript -->
            </div>
        </div>
    </div>

    <script src="weather2.js"></script>
</body>

</html>
